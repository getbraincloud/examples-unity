<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* Full-bleed responsive canvas: no fixed windowed size, so there's no white/light
         page surrounding the game, and fullscreen just means the browser resizes the
         viewport — the canvas already tracks it via Unity's matchWebGLToCanvasSize. */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b1220;
        overflow: hidden;
      }
      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #0b1220;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #0b1220;
        display: block;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        color: #cbd5e1;
      }
      #unity-progress-bar-empty {
        width: 220px;
        height: 8px;
        margin-top: 14px;
        border-radius: 4px;
        background: #1e293b;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #3b82f6;
        transition: width 0.2s ease-out;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 5%;
        transform: translate(-50%);
        background: #1e293b;
        color: #f1f5f9;
        padding: 10px 14px;
        border-radius: 6px;
        display: none;
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      }
      #unity-footer {
        position: fixed;
        right: 12px;
        bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 2;
      }
      #unity-fullscreen-button {
        cursor: pointer;
        width: 28px;
        height: 28px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #cbd5e1;
        font-size: 16px;
        user-select: none;
      }
      #unity-fullscreen-button:hover { background: rgba(255, 255, 255, 0.16); }
      #unity-build-title {
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        font-size: 13px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div>Loading {{{ PRODUCT_NAME }}}&hellip;</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-fullscreen-button" title="Fullscreen">&#9974;</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #7f1d1d; padding: 4px; border-radius: 4px;';
        else {
          if (type == 'warning') div.style = 'background: #78350f; padding: 4px; border-radius: 4px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
